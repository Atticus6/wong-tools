[package]
name = "wong-tools"
version = "0.1.2"
edition = "2021"

[dependencies]
arboard = "3.6"
chrono = "0.4"
cosmic-text = "0.19"
global-hotkey = "0.6.4"
gpui-kit = "0.7.1"
image = "0.25"
libsql = "0.9"
native-tls = "0.2"
posthog-rs = { version = "0.27.0", default-features = false, features = ["error-tracking"] }
rand = "0.8"
resvg = "0.44"
rust-i18n = "4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smallvec = "1"
tokio = { version = "1", features = ["rt"] }
toml_edit = "0.22"
tungstenite = { version = "0.24", features = ["native-tls"] }
muda = "0.21"
tray-icon = "0.26"
ureq = { version = "2.10", features = ["json"] }
xcap = "0.9"

# macOS 屏幕录制授权（CGRequestScreenCaptureAccess）：xcap 自己不弹框，
# 没授权 CGWindowListCreateImage 只给纯壁纸。只要 mac 用得到。
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"

# gpui-kit 官方文档推荐：只优化框架依赖的 Debug 运行时性能，
# 应用自身仍保持 Debug，详见 https://gpui-kit.com/docs/installation
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
